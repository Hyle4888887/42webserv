<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webserv</title>
<style>

:root{
  --bg:#050a06;
  --bg-panel:#081208;
  --bg-panel-2:#0a1610;
  --border:#183a24;
  --green:#3dff7a;
  --green-dim:#1f7a3d;
  --green-glow:rgba(61,255,122,.35);
  --amber:#ffb300;
  --red:#ff5c5c;
  --cyan:#5fd6ff;
  --fg-dim:#5f8f70;
  --fg-dimmer:#3a5c46;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 50% -10%, #0a1c0f 0%, var(--bg) 55%);
  color:var(--green);
  font-family:var(--mono);
  font-size:14px;
  padding:24px 16px 60px;
  min-height:100%;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,20,8,.35) 3px
  );
  mix-blend-mode:multiply;
  opacity:.5;
  z-index:50;
}

.crt{
  max-width:880px;
  margin:0 auto;
  border:1px solid var(--border);
  border-radius:6px;
  background:linear-gradient(180deg, var(--bg-panel) 0%, #060d07 100%);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.4),
    0 20px 60px -20px rgba(0,0,0,.8),
    0 0 40px -10px var(--green-glow);
  overflow:hidden;
}

.titlebar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:#0a1710;
  border-bottom:1px solid var(--border);
  color:var(--fg-dim);
  font-size:12px;
  letter-spacing:.02em;
}
.dots{display:flex;gap:6px;}
.dots i{
  width:9px;height:9px;border-radius:50%;
  display:inline-block;
  background:var(--fg-dimmer);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);
}
.dots i:nth-child(1){background:#4a2a2a;}
.dots i:nth-child(2){background:#4a3a1a;}
.dots i:nth-child(3){background:#1f4a2a;}
.titlebar .title{flex:1;text-align:center;color:var(--fg-dim);}
.titlebar .clock{color:var(--fg-dimmer);font-variant-numeric:tabular-nums;}

.banner{
  padding:14px 16px 6px;
  color:var(--fg-dim);
  font-size:13px;
  line-height:1.7;
  white-space:pre-wrap;
  border-bottom:1px dashed var(--border);
}
.banner .cursor{
  display:inline-block;width:8px;height:14px;
  background:var(--green);
  vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}
@media (prefers-reduced-motion: reduce){
  .banner .cursor{animation:none;opacity:1;}
}
@keyframes blink{50%{opacity:0;}}

.panel{border-bottom:1px solid var(--border);}
.panel:last-child{border-bottom:none;}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 16px;
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--fg-dim);
  background:rgba(61,255,122,.03);
  border-bottom:1px solid var(--border);
}

/* ---------- transcript log ---------- */
.log{
  max-height:220px;
  overflow-y:auto;
  padding:10px 16px;
  font-size:12.5px;
  line-height:1.9;
}
.log:empty::after{
  content:"(aucune requête encore — connecte-toi ci-dessous)";
  color:var(--fg-dimmer);
}
.log-line{
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
}
.log-time{color:var(--fg-dimmer);flex:0 0 auto;}
.log-path{color:var(--green);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;}
.log-status{flex:0 0 auto;font-weight:600;min-width:3.5em;text-align:right;}
.log-status.pending{color:var(--fg-dim);}
.log-status.status-ok{color:var(--green);text-shadow:0 0 8px var(--green-glow);}
.log-status.status-warn{color:var(--amber);}
.log-status.status-err{color:var(--red);}

.pill{
  flex:0 0 auto;
  font-size:10.5px;
  font-weight:700;
  padding:2px 6px;
  border-radius:3px;
  letter-spacing:.04em;
}
.pill-get{color:#0a1710;background:var(--cyan);}
.pill-post{color:#0a1710;background:var(--green);}
.pill-delete{color:#1a0a0a;background:var(--red);}

/* ---------- upload panel ---------- */
.upload-panel .panel-head{border-bottom:1px solid var(--border);}
.dropzone{
  margin:16px;
  border:1px dashed var(--green-dim);
  border-radius:4px;
  padding:24px 16px;
  text-align:center;
  color:var(--fg-dim);
  transition:border-color .15s, background-color .15s;
}
.dropzone.drag{
  border-color:var(--green);
  background:rgba(61,255,122,.05);
  color:var(--green);
}
.dropzone p{margin:0 0 10px;font-size:13px;}
.filebtn{
  display:inline-block;
  padding:7px 14px;
  border:1px solid var(--green-dim);
  border-radius:3px;
  color:var(--green);
  cursor:pointer;
  font-size:12.5px;
  letter-spacing:.02em;
  transition:background-color .15s, border-color .15s;
}
.filebtn:hover{border-color:var(--green);background:rgba(61,255,122,.06);}
.filebtn:focus-within{outline:1px solid var(--green);outline-offset:2px;}

#uploadHint{margin-top:10px;font-size:11.5px;color:var(--fg-dimmer);min-height:1.2em;}
#uploadHint.err{color:var(--red);}
#uploadHint.ok{color:var(--green);}

/* ---------- listing ---------- */
.ghost-btn{
  background:none;
  border:1px solid var(--fg-dimmer);
  color:var(--fg-dim);
  font-family:inherit;
  font-size:11px;
  padding:3px 9px;
  border-radius:3px;
  cursor:pointer;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.ghost-btn:hover{border-color:var(--green-dim);color:var(--green);}

.listing{padding:6px 0 12px;}
.listing-empty, .listing-error{
  padding:16px;
  color:var(--fg-dimmer);
  font-size:12.5px;
}
.listing-error{color:var(--red);}

.file-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 16px;
  border-bottom:1px solid rgba(24,58,36,.5);
  font-size:13px;
}
.file-row:hover{background:rgba(61,255,122,.03);}
.file-perm{color:var(--fg-dimmer);font-size:11.5px;flex:0 0 auto;}
.file-name{
  flex:1 1 auto;
  color:var(--green);
  text-decoration:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.file-name:hover{text-decoration:underline;text-shadow:0 0 6px var(--green-glow);}
.file-meta{color:var(--fg-dimmer);font-size:11.5px;flex:0 0 auto;}
.file-del{
  flex:0 0 auto;
  background:none;
  border:1px solid #5a2020;
  color:var(--red);
  font-family:inherit;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
  padding:3px 8px;
  border-radius:3px;
  cursor:pointer;
}
.file-del:hover{background:rgba(255,92,92,.1);border-color:var(--red);}
.file-del:disabled{opacity:.4;cursor:default;}

.footline{
  padding:10px 16px 4px;
  font-size:11px;
  color:var(--fg-dimmer);
  text-align:center;
}

@media (max-width:520px){
  body{padding:10px 6px 40px;font-size:13px;}
  .log{font-size:11.5px;}
  .log-time{display:none;}
}
</style>
</head>
<body>
<div class="crt">
  <div class="titlebar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="title">webserv</span>
    <span class="clock" id="clock"></span>
  </div>

  <div class="banner" id="banner"></div>

  <section class="panel transcript-panel">
    <header class="panel-head">
      <span>Transcript</span>
      <span id="reqCount">0 requêtes</span>
    </header>
    <div class="log" id="log" aria-live="polite"></div>
  </section>

  <section class="panel upload-panel">
    <header class="panel-head"><span>POST /uploads/</span></header>
    <div class="dropzone" id="dropzone">
      <p>Dépose un fichier ici, ou</p>
      <label class="filebtn">
        choisir un fichier
        <input type="file" id="fileInput" hidden>
      </label>
      <div id="uploadHint"></div>
    </div>
  </section>

  <section class="panel listing-panel">
    <header class="panel-head">
      <span>GET /uploads/</span>
      <button class="ghost-btn" id="refreshBtn" type="button">refresh</button>
    </header>
    <div class="listing" id="listing"></div>
  </section>

  <div class="footline">webserv · autoindex live via fetch() · aucune dépendance externe</div>
</div>

<script>
(function(){
  "use strict";

  var BASE = "/uploads/";
  var REFRESH_MS = 8000;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var logEl = document.getElementById("log");
  var listingEl = document.getElementById("listing");
  var reqCountEl = document.getElementById("reqCount");
  var uploadHintEl = document.getElementById("uploadHint");
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  var refreshBtn = document.getElementById("refreshBtn");
  var clockEl = document.getElementById("clock");

  var reqCount = 0;

  /* ---------- clock ---------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function updateClock(){
    var d = new Date();
    clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ---------- boot banner ---------- */
  var bannerLines = [
    "Trying 127.0.0.1...",
    "Connected to webserv.",
    "Escape character is '^]'."
  ];
  var bannerEl = document.getElementById("banner");
  function renderBannerInstant(){
    bannerEl.textContent = bannerLines.join("\n");
    var c = document.createElement("span");
    c.className = "cursor";
    bannerEl.appendChild(c);
  }
  function typeBanner(){
    var full = bannerLines.join("\n");
    var i = 0;
    var span = document.createElement("span");
    bannerEl.textContent = "";
    bannerEl.appendChild(span);
    var cursor = document.createElement("span");
    cursor.className = "cursor";
    bannerEl.appendChild(cursor);
    var timer = setInterval(function(){
      span.textContent = full.slice(0, i);
      i++;
      if (i > full.length) clearInterval(timer);
    }, 12);
  }
  if (reduceMotion) renderBannerInstant(); else typeBanner();

  /* ---------- HTTP status text fallback ---------- */
  var STATUS_TEXT = {
    200:"OK",201:"Created",204:"No Content",301:"Moved Permanently",
    302:"Found",400:"Bad Request",403:"Forbidden",404:"Not Found",
    405:"Method Not Allowed",413:"Payload Too Large",500:"Internal Server Error"
  };

  /* ---------- transcript ---------- */
  function appendLog(method, path){
    reqCount++;
    reqCountEl.textContent = reqCount + (reqCount === 1 ? " requête" : " requêtes");

    var line = document.createElement("div");
    line.className = "log-line";

    var time = document.createElement("span");
    time.className = "log-time";
    var d = new Date();
    time.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());

    var pill = document.createElement("span");
    pill.className = "pill pill-" + method.toLowerCase();
    pill.textContent = method;

    var pathSpan = document.createElement("span");
    pathSpan.className = "log-path";
    pathSpan.textContent = path + " HTTP/1.1";

    var status = document.createElement("span");
    status.className = "log-status pending";
    status.textContent = "…";

    line.appendChild(time);
    line.appendChild(pill);
    line.appendChild(pathSpan);
    line.appendChild(status);
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    return status;
  }

  function setStatus(el, code, text){
    el.classList.remove("pending");
    if (code === 0){
      el.textContent = "ERR";
      el.classList.add("status-err");
      return;
    }
    el.textContent = code + " " + (text || STATUS_TEXT[code] || "");
    if (code >= 200 && code < 300) el.classList.add("status-ok");
    else if (code >= 400) el.classList.add("status-err");
    else el.classList.add("status-warn");
  }

  function api(method, path, opts){
    var statusEl = appendLog(method, path);
    return fetch(path, Object.assign({ method: method }, opts || {}))
      .then(function(res){
        setStatus(statusEl, res.status, res.statusText);
        return res;
      })
      .catch(function(err){
        setStatus(statusEl, 0, "Network Error");
        throw err;
      });
  }

  /* ---------- listing ----------
     Format réel observé (curl -v GET /uploads/):
       <a href="/uploads/.gitkeep">.gitkeep</a>
       <a href="/uploads/upload">upload</a>
       <a href="/uploads/..">..</a>
     Les hrefs sont des CHEMINS ABSOLUS incluant déjà /uploads/, et le
     parent est "/uploads/.." (pas "../"). On extrait donc le nom de
     fichier depuis la fin du href plutôt que d'utiliser BASE + href. */
  function parseListing(html){
    var doc = new DOMParser().parseFromString(html, "text/html");
    var anchors = Array.prototype.slice.call(doc.querySelectorAll("a[href]"));
    return anchors
      .map(function(a){
        var rawHref = a.getAttribute("href") || "";
        var decoded = rawHref;
        try { decoded = decodeURIComponent(rawHref); } catch(e){}
        var trimmed = decoded.replace(/\/+$/, ""); // enlève un éventuel "/" final
        var lastSlash = trimmed.lastIndexOf("/");
        var name = lastSlash === -1 ? trimmed : trimmed.slice(lastSlash + 1);
        return { name: name, href: rawHref, text: a.textContent.trim() };
      })
      .filter(function(a){
        if (!a.name) return false;
        if (a.name === "..") return false;
        if (/^parent directory$/i.test(a.text)) return false;
        return true;
      });
  }

  function renderListing(files){
    listingEl.innerHTML = "";
    if (!files.length){
      var empty = document.createElement("div");
      empty.className = "listing-empty";
      empty.textContent = "vide — envoie un fichier ci-dessus.";
      listingEl.appendChild(empty);
      return;
    }
    files.forEach(function(f){
      var row = document.createElement("div");
      row.className = "file-row";

      var perm = document.createElement("span");
      perm.className = "file-perm";
      perm.textContent = "-rw-r--r--";

      var link = document.createElement("a");
      link.className = "file-name";
      link.href = f.href; // déjà un chemin absolu renvoyé par le serveur (ex: /uploads/photo.png)
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = f.name;

      var del = document.createElement("button");
      del.className = "file-del";
      del.type = "button";
      del.textContent = "DELETE";
      del.addEventListener("click", function(){
        handleDelete(f.name, del);
      });

      row.appendChild(perm);
      row.appendChild(link);
      row.appendChild(del);
      listingEl.appendChild(row);
    });
  }

  function renderListingError(){
    listingEl.innerHTML = "";
    var err = document.createElement("div");
    err.className = "listing-error";
    err.textContent = "échec du listage — le serveur a répondu une erreur.";
    listingEl.appendChild(err);
  }

  function refreshListing(){
    return api("GET", BASE)
      .then(function(res){
        if (!res.ok){ renderListingError(); return; }
        return res.text().then(function(html){
          renderListing(parseListing(html));
        });
      })
      .catch(function(){ renderListingError(); });
  }

  /* ---------- delete ---------- */
  function handleDelete(name, btnEl){
    if (!window.confirm("DELETE " + name + " ?\nCette action est irréversible.")) return;
    btnEl.disabled = true;
    api("DELETE", BASE + encodeURIComponent(name))
      .then(function(res){
        if (res.ok || res.status === 204){
          refreshListing();
        } else {
          btnEl.disabled = false;
          window.alert("Suppression refusée (" + res.status + ")");
        }
      })
      .catch(function(){
        btnEl.disabled = false;
        window.alert("Erreur réseau pendant la suppression.");
      });
  }

  /* ---------- upload ---------- */
  function setHint(msg, kind){
    uploadHintEl.textContent = msg || "";
    uploadHintEl.classList.remove("ok", "err");
    if (kind) uploadHintEl.classList.add(kind);
  }

  function uploadFile(file){
    if (!file) return;
    setHint("envoi de " + file.name + "…");
    var fd = new FormData();
    fd.append("file", file, file.name);
    api("POST", BASE, { body: fd })
      .then(function(res){
        if (res.ok){
          setHint(file.name + " envoyé.", "ok");
          refreshListing();
        } else {
          setHint("échec de l'envoi (" + res.status + ")", "err");
        }
      })
      .catch(function(){
        setHint("erreur réseau pendant l'envoi.", "err");
      });
  }

  fileInput.addEventListener("change", function(){
    if (fileInput.files && fileInput.files[0]) uploadFile(fileInput.files[0]);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault();
      dropzone.classList.add("drag");
    });
  });
  ["dragleave", "drop"].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault();
      dropzone.classList.remove("drag");
    });
  });
  dropzone.addEventListener("drop", function(e){
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files[0]) uploadFile(dt.files[0]);
  });

  /* ---------- misc ---------- */
  refreshBtn.addEventListener("click", refreshListing);

  refreshListing();
  setInterval(refreshListing, REFRESH_MS);
})();
</script>
</body>
</html>
