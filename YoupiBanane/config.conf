server {
    listen 0.0.0.0:3000;
    server_name localhost;
    client_max_body_size 200000000;
    location / {
        root YoupiBanane;
        allowed_methods GET;
    }

    location /uploads {
        root ./uploads;
        allowed_methods GET POST DELETE;
        upload_dir on ./uploads;
        autoindex on;
    }
    
    location /post_body {
        root YoupiBanane;
        allowed_methods POST;
        client_max_body_size 100;
    }
    
    location /directory {
        root YoupiBanane;
        allowed_methods GET POST;
        index youpi.bad_extension;
        cgi .bla YoupiBanane/cgi_tester;
    }
    
    location /youpi.bla {
        root YoupiBanane;
        allowed_methods POST;
        cgi .bla YoupiBanane/cgi_tester;
    }
}