<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>webserv</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.5; }
    a { display: inline-block; margin-right: 16px; }
  </style>
</head>
<body>
  <h1>webserv</h1>
  <p>This page is served by the static file handler.</p>
  <form action="/uploads/" method="post" enctype="multipart/form-data" style="margin: 24px 0; padding: 16px; border: 1px solid #ccc; max-width: 420px;">
    <label for="file">Upload a file, image, or video</label><br>
    <input id="file" name="file" type="file" style="margin: 12px 0;">
    <br>
    <button type="submit">Upload</button>
  </form>
  <p>
    <a href="/cgi-bin/hello.py">CGI GET</a>
    <a href="/redirect">Redirect</a>
    <a href="/uploads/">Uploads folder</a>
  </p>
</body>
</html>
