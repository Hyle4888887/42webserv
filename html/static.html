<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Static Page</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 60px auto; color: #222; background: #f9f9f9; }
    .box { background: #e8f4fd; border-left: 4px solid #0066cc; padding: 16px 20px; border-radius: 4px; }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <h1>📄 Static Page</h1>
  <div class="box">
    <p>Ceci est une page HTML statique servie directement depuis le disque.</p>
    <p>Si tu vois cette page, ton serveur sait correctement lire et envoyer un fichier avec les bons headers HTTP.</p>
  </div>
  <p><a href="/index.html">← Retour à l'accueil</a></p>
</body>
</html>
